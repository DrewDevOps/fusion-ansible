- name: Run Freeswitch installation script
  shell: |
    export TOKEN={{ signalwire_token }}

    apt-get update && apt-get install -y gnupg2 wget lsb-release

    wget --http-user=signalwire --http-password=$TOKEN -O /usr/share/keyrings/signalwire-freeswitch-repo.gpg https://freeswitch.signalwire.com/repo/deb/debian-release/signalwire-freeswitch-repo.gpg

    echo "machine freeswitch.signalwire.com login signalwire password $TOKEN" > /etc/apt/auth.conf

    chmod 600 /etc/apt/auth.conf

    echo "deb [signed-by=/usr/share/keyrings/signalwire-freeswitch-repo.gpg] https://freeswitch.signalwire.com/repo/deb/debian-release/ bookworm main" > /etc/apt/sources.list.d/freeswitch.list
    echo "deb-src [signed-by=/usr/share/keyrings/signalwire-freeswitch-repo.gpg] https://freeswitch.signalwire.com/repo/deb/debian-release/ bookworm main" >> /etc/apt/sources.list.d/freeswitch.list

    apt-get update && apt-get install -y freeswitch-meta-all
  args:
    executable: /bin/bash