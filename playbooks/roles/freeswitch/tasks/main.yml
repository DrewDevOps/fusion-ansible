- name: Add SignalWire FreeSWITCH repository
  ansible.builtin.apt_repository:
    repo: "deb https://signalwire-oss-repo.s3.amazonaws.com/repo/deb/debian/ {{ ansible_distribution_release }} main"
    state: present
    filename: freeswitch

- name: Import FreeSWITCH GPG key
  ansible.builtin.apt_key:
    url: https://signalwire-oss-repo.s3.amazonaws.com/repo/deb/debian/signalwire-freeswitch-repo.gpg
    state: present

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes

- name: Install FreeSWITCH packages
  ansible.builtin.apt:
    name:
      - freeswitch
      - freeswitch-conf-vanilla
      - freeswitch-lang-en
      - freeswitch-sounds-en-us-callie
      - freeswitch-music-default
    state: present
